name: Verify DWTS automation runner

on:
  push:
    branches: [main]
    paths:
      - 'scripts/Automations/**'
      - '.github/workflows/verify-dwts-automation-runner.yml'
  workflow_dispatch:
    inputs:
      photo_dry_run:
        description: 'Also check the live X timeline and GitHub listing, without uploading'
        type: boolean
        default: false
      week:
        description: 'Week number for the optional photo dry run'
        type: number
        default: 4
      couples:
        description: 'JSON object of star-to-pro names for the optional photo dry run'
        type: string
        default: '{"Amber Glenn":"Pasha Pashkov"}'
      since:
        description: 'Optional airing date (YYYY-MM-DD) for the photo dry run'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/Automations/requirements-runner.txt
      - name: Install photo dependency
        run: python -m pip install -r scripts/Automations/requirements-runner.txt
      - name: Check Python scripts and gallery-dl integration
        run: |
          python -m py_compile scripts/Automations/dwts-photos.py scripts/Automations/dwts-wiki.py
          python scripts/Automations/check-gallery-runner.py
      - name: Optional live-source dry run (no uploads)
        if: github.event_name == 'workflow_dispatch' && inputs.photo_dry_run
        env:
          DWTS_GITHUB_TOKEN: ${{ secrets.DWTS_PHOTOS_GITHUB_TOKEN }}
          DWTS_WEEK: ${{ inputs.week }}
          DWTS_COUPLES: ${{ inputs.couples }}
          DWTS_SINCE: ${{ inputs.since }}
        run: |
          if [[ -z "$DWTS_GITHUB_TOKEN" ]]; then
            echo 'Add the DWTS_PHOTOS_GITHUB_TOKEN repository secret before a live-source dry run.' >&2
            exit 1
          fi
          args=(python scripts/Automations/dwts-photos.py --week "$DWTS_WEEK" --couples "$DWTS_COUPLES" --dry-run --print)
          if [[ -n "$DWTS_SINCE" ]]; then args+=(--since "$DWTS_SINCE"); fi
          "${args[@]}"
