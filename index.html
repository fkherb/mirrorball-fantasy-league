<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirrorball Fantasy League</title><link rel="stylesheet" href="styles.css"></head><body><header><b>◉ Mirrorball Fantasy League</b><span id="auth">Public view</span></header><div class="layout"><nav><button data-view="standings" class="active">Standings</button><button data-view="score">Score desk</button><button data-view="roster">Roster manager</button><button data-view="commissioner">Commissioner</button></nav><main><section id="standings" class="view active"><p class="eyebrow">Season standings</p><h1>Standings</h1><div class="card empty">Create teams, players, and scores manually.</div></section><section id="score" class="view"><h1>Score desk</h1><select id="week"></select><div class="card pad"><label>Find player<input id="scoreSearch"></label><div id="scoreResults" class="results"></div></div></section><section id="roster" class="view"><div class="splithead"><div><h1>Roster manager</h1><p class="sub">Cast, partnerships, ownership, and eliminations.</p></div><button id="newPlayer">Add Player</button></div><div class="card pad"><label>Search player pool<input id="rosterSearch"></label><div id="rosterResults" class="results"></div></div></section><section id="commissioner" class="view"><h1>Commissioner</h1><div class="card pad"><h2>Sign in</h2><label>Email<input id="email" type="email"></label><button id="magic">Send sign-in link</button><hr><h2>Create fantasy team</h2><label>Manager name<input id="managerName" placeholder="Freddy"></label><label>Fantasy team name<input id="teamName" placeholder="New Money"></label><button id="createTeam">Create team</button><hr><h2>Existing teams</h2><div id="teams"></div></div></section></main></div><dialog id="modal"><form method="dialog"><button class="close">×</button><div id="modalBody"></div></form></dialog><script type="module" src="app.js"></script></body></html>
