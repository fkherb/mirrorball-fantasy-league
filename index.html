<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirrorball Fantasy League</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="roster.css?v=20260921-cast"></head>
<body>
<header><b>◉ Mirrorball Fantasy League</b><div class="account"><button id="auth" class="auth-button" aria-live="polite">Checking access…</button><div id="accountMenu" class="account-menu" hidden><span id="accountEmail"></span><button id="signOut" class="secondary">Sign out</button></div></div></header>
<div class="layout"><nav><button class="active" data-view="standings">Standings</button><button data-view="score">Score desk</button><button data-view="roster">Cast roster</button><button data-view="teams">Team overview</button></nav><main>
<section id="standings" class="view active"><h1>Standings</h1><div class="card empty">No scores yet.</div></section>
<section id="score" class="view"><h1>Score desk</h1><select id="week"></select><div class="card pad"><input id="scoreSearch" placeholder="Find player"><div id="scoreResults"></div></div></section>
<section id="roster" class="view"><div class="splithead"><h1>Cast Roster</h1><button id="newPlayer" hidden>Add Cast Member</button></div><div class="card pad"><input id="rosterSearch" placeholder="Search cast"><div class="filter-tabs" id="rosterTabs"><button class="selected" data-roster-filter="all">All</button><button data-roster-filter="pros">Pros</button><button data-roster-filter="stars">Stars</button><button data-roster-filter="bonus">Bonus</button></div><div id="rosterResults"></div></div></section>
<section id="teams" class="view"><div class="splithead"><div><h1>Team Overview</h1><p class="sub">Fantasy teams and their current cast rosters.</p></div><button id="newTeam" hidden>Add Fantasy Team</button></div><div id="teamResults" class="team-grid"></div></section>
<section id="signin" class="view"><h1>Sign in</h1><div class="card pad"><p class="sub">Commissioner access lets you update the league. Everyone can still browse the public pages.</p><label>Email<input id="email" type="email" placeholder="herbfreddy@gmail.com" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="magic">Sign in</button></div></section>
</main></div><dialog id="modal"><button id="modalClose" class="close" type="button" aria-label="Close">×</button><div id="modalBody"></div></dialog><script src="ui.js?v=20260921-navigation"></script><script type="module" src="app.js?v=20260921-modal-fix"></script></body></html>
