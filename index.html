<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirrorball Fantasy League</title><link rel="stylesheet" href="styles.css"></head><body><header><b>◉ Mirrorball Fantasy League</b><span id="auth">Public view</span></header><div class="layout"><nav><button class="active" data-view="standings">Standings</button><button data-view="score">Score desk</button><button data-view="roster">Roster manager</button><button data-view="commissioner">Commissioner</button></nav><main><section id="standings" class="view active"><h1>Standings</h1><div class="card empty">No scores yet.</div></section><section id="score" class="view"><h1>Score desk</h1><select id="week"></select><div class="card pad"><input id="scoreSearch" placeholder="Find player"><div id="scoreResults"></div></div></section><section id="roster" class="view"><div class="splithead"><h1>Roster manager</h1><button id="newPlayer">Add Player</button></div><div class="card pad"><input id="rosterSearch" placeholder="Search player"><div id="rosterResults"></div></div></section><section id="commissioner" class="view"><h1>Commissioner</h1><div class="card pad"><h2>Sign in</h2><label>Email<input id="email" type="email" placeholder="herbfreddy@gmail.com"></label><label>Password<input id="password" type="password"></label><button id="magic">Sign in</button><hr><h2>Create fantasy team</h2><label>Manager<input id="managerName"></label><label>Team name<input id="teamName"></label><button id="createTeam">Create team</button><div id="teams"></div></div></section></main></div><dialog id="modal"><form method="dialog"><button class="close">×</button><div id="modalBody"></div></form></dialog><script src="ui.js"></script><script type="module" src="app.js"></script></body></html>
